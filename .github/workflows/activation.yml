name: Acquire Activation File

on:
  workflow_dispatch: {}
  push:
    branches: [ master, main, dev ]

jobs:
  activation:
    name: Request Activation (.alf)
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2020.3.26f1-webgl-3.2.1
    steps:
      - name: Generate activation file
        run: |
          unity-editor -batchmode -nographics -createManualActivationFile || true
          ls -la
          ALF_FILE=$(ls *.alf | head -n 1)
          echo "Generated ALF: $ALF_FILE"

      - name: Upload activation artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-Request
          path: "*.alf"
