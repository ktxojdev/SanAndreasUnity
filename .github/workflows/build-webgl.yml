name: Build WebGL

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build SanAndreasUnity WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: 2020.3.26f1
          buildMethod: SanAndreasUnity.Editor.BuildWebGLScript.Build
          buildsPath: Builds

      - name: Upload WebGL Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanAndreasUnity-WebGL
          path: Builds/WebGL
